; RX-only LoRa sniffer for debugging the repeater's downlink at the PHY level.
; No MeshCore, no display, never transmits: every packet, CRC/header error and
; the noise floor go out on USB serial.
;
;   pio run -e tlora-pager -t upload && pio device monitor
;
; Flashing REPLACES the device's firmware (reflash Ripple/MeshCore afterwards).

[env:tlora-pager]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  jgromes/RadioLib@7.1.2
monitor_speed = 115200

[env:tdeck]
extends = env:tlora-pager
build_flags =
  ${env:tlora-pager.build_flags}
  -DBOARD_TDECK

; same, but listening at SF10 (sensitivity test; the repeater must match)
[env:tdeck-sf10]
extends = env:tlora-pager
build_flags =
  ${env:tlora-pager.build_flags}
  -DBOARD_TDECK
  -DSNIFF_SF=10
