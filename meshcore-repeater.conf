# MeshCore repeater configuration
# All radio parameters are applied at startup and can be changed live from the
# CLI (e.g. "freq 434.0", "set tx_power 20"). Lines are key = value; '#' comments.

# ---- radio ----
# Frequency in MHz. Default keeps clear of LoRa-APRS (~433.775 MHz). Pick a
# 70cm frequency permitted for your licence class. NB: SF/BW/CR/sync below must
# match the other MeshCore nodes you want to interoperate with.
frequency        = 433.500
bandwidth        = 250        # kHz  62.5 / 125 / 250 / 500  (MeshCore default 250)
spreading_factor = 10         # MeshCore default
coding_rate      = 5          # 4/5  (MeshCore default)
preamble         = 16         # symbols
sync_word        = private    # MeshCore PRIVATE (0x1424); 'public' = 0x3444
crc              = true
iq_inverted      = false

# tx_power = the SX126x CHIP setpoint, in dBm, range -9..22. This is NOT the
# antenna power: the F30 module's on-board PA adds ~8-11 dB on top, so chip 22
# -> ~+30 dBm at the antenna (a bit more at 5 V VCC). 22 is the maximum.
# If your module's PA overdrives at 22 (output compresses / excessive current),
# lower this to ~19-20. Make sure your antenna EIRP is legal for your licence.
tx_power         = 22

# Listen-before-talk via CAD. If the repeater seems to never transmit, set false.
use_cad          = true

# DIO3 TCXO control voltage (the F30 has an on-board 32 MHz TCXO). 0 = no TCXO.
tcxo_voltage     = 1.6
# Over-current protection register (raw, 2.5 mA/step). 0x38 = 140 mA.
ocp              = 0x38

# ---- hardware wiring (BCM/gpio line numbers - MATCH YOUR ACTUAL WIRING) ----
# Defaults below match the NiceRF LoRa1262F30/SX126x reference schematic:
# NSS is a manual GPIO (not the hardware CE), and the antenna switch is driven
# internally by the chip's DIO2 (the module exposes no RXEN/TXEN pins).
spi_dev          = /dev/spidev0.0
spi_speed        = 2000000    # Hz (<= 10 MHz)
gpio_chip        = gpiochip0  # Raspberry Pi 5: use gpiochip4
gpio_reset       = 18         # NRST  (output)  -> pin 12
gpio_busy        = 20         # BUSY  (input)   -> pin 38
gpio_dio1        = 16         # DIO1  (input)   -> pin 36
gpio_nss         = 21         # NSS   (output, manual chip-select) -> pin 40

# Antenna switch: 'dio2' = chip drives DIO2 internally (this board);
# 'external' = drive RXEN/TXEN GPIO (only for modules that expose those pins).
rf_switch        = dio2
gpio_rxen        = 23         # only used if rf_switch = external
gpio_txen        = 22         # only used if rf_switch = external

# ---- status LEDs ----
use_leds         = true
gpio_led_on      = 19         # "ON" LED, solid while running   -> pin 35
gpio_led_data    = 26         # "DATA" LED, pulses on RX/TX     -> pin 37

# ---- node / mesh ----
name             = HamRepeater
key_file         = repeater.key      # auto-generated on first run; keep private
forward          = true              # act as a repeater
advert_interval  = 7200              # seconds between self-adverts (0 = off)

# ---- ham content policy (STRICT: forward public, drop private) ----
# Amateur radio forbids relaying messages whose meaning is obscured. This
# repeater therefore retransmits ONLY: signed adverts, plaintext traces, and
# group messages on a PUBLIC channel you declare below. Direct/private messages
# and any channel not listed here are dropped (never retransmitted).
#
# Declare each public channel by its shared key. Only configure channels whose
# key is PUBLISHED publicly - a published key does not obscure meaning, which is
# what makes relaying it legal. Repeatable; base64 or hex (16- or 32-byte key),
# optional "name:" label. With NO entries the repeater relays adverts only.
#
#   public_channel = izOH6cXN6mrJ5e26oRXNcg==      # MeshCore default "Public"
#   public_channel = MyClub:8b3387e9c5cdea6ac9e5edbaa115cd72   # hex, named
#
# public_channel = izOH6cXN6mrJ5e26oRXNcg==

# Answer "ping" on a public channel with "pong" (a presence/liveness check).
# Requires at least one public_channel above (the reply goes out on the same
# channel, encrypted with its published key). Off by default.
ping_pong        = false

# Optional location advertised in the self-advert:
# location       = true
# latitude       = 50.8503
# longitude      = 4.3517
