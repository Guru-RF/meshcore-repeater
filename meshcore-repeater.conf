# MeshCore repeater configuration
# All radio parameters are applied at startup and can be changed live from the
# CLI (e.g. "freq 434.0", "set tx_power 20"). Lines are key = value; '#' comments.

# ---- radio (IARU R1 ham-MeshCore RFC) ----
# Defaults follow github.com/Guru-RF/meshcore-rfc-iaru-r1: a single 70 cm
# ham-only calling frequency, MeshCore stock Europe profile otherwise.
# NB: with 62.5 kHz the occupied band is ~434.859..434.921 MHz - do NOT emit
# above 435.000 MHz (protects the amateur-satellite segment). SF/BW/CR/sync
# must match the other MeshCore nodes you interoperate with.
frequency        = 434.890    # MHz  IARU R1 ham-MeshCore calling QRG
bandwidth        = 62.5       # kHz  62.5 / 125 / 250 / 500
spreading_factor = 8          # RFC
coding_rate      = 8          # 4/8  (RFC)
preamble         = 16         # symbols
sync_word        = private    # MeshCore default (0x1424); 'public' = 0x3444
crc              = true
iq_inverted      = false

# tx_power = the SX126x CHIP setpoint, in dBm, range -9..22. This is NOT the
# antenna power: the F30 module's on-board PA adds ~8-11 dB on top, so chip 22
# -> ~+30 dBm at the antenna (a bit more at 5 V VCC). 22 is the maximum.
# If your module's PA overdrives at 22 (output compresses / excessive current),
# lower this to ~19-20. Make sure your antenna EIRP is legal for your licence.
tx_power         = 22

# Listen-before-talk via CAD. If the repeater seems to never transmit, set false.
use_cad          = true

# DIO3 TCXO control voltage (the F30 has an on-board 32 MHz TCXO). 0 = no TCXO.
tcxo_voltage     = 1.6
# Over-current protection register (raw, 2.5 mA/step). 0x38 = 140 mA.
ocp              = 0x38

# ---- hardware wiring (BCM/gpio line numbers - MATCH YOUR ACTUAL WIRING) ----
# Defaults below match the NiceRF LoRa1262F30/SX126x reference schematic:
# NSS is a manual GPIO (not the hardware CE), and the antenna switch is driven
# internally by the chip's DIO2 (the module exposes no RXEN/TXEN pins).
spi_dev          = /dev/spidev0.0
spi_speed        = 2000000    # Hz (<= 10 MHz)
gpio_chip        = gpiochip0  # Raspberry Pi 5: use gpiochip4
gpio_reset       = 18         # NRST  (output)  -> pin 12
gpio_busy        = 20         # BUSY  (input)   -> pin 38
gpio_dio1        = 16         # DIO1  (input)   -> pin 36
gpio_nss         = 21         # NSS   (output, manual chip-select) -> pin 40

# Antenna switch: 'dio2' = chip drives DIO2 internally (this board);
# 'external' = drive RXEN/TXEN GPIO (only for modules that expose those pins).
rf_switch        = dio2
gpio_rxen        = 23         # only used if rf_switch = external
gpio_txen        = 22         # only used if rf_switch = external

# ---- status LEDs ----
use_leds         = true
gpio_led_on      = 19         # "ON" LED, solid while running   -> pin 35
gpio_led_data    = 26         # "DATA" LED, pulses on RX/TX     -> pin 37

# ---- node / mesh ----
name             = HamRepeater
key_file         = repeater.key      # auto-generated on first run; keep private
forward          = true              # act as a repeater
advert_interval  = 1800              # seconds between self-adverts (0 = off)
                                     # 1800 = 30 min: guarantees the mandatory
                                     # >=1 ID/hour with margin. The advert is the
                                     # repeater's on-air ID - set 'name' to your
                                     # callsign below for it to count as valid ID.

# ---- ham content policy (STRICT: forward public, drop private) ----
# Amateur radio forbids relaying messages whose meaning is obscured. This
# repeater therefore retransmits ONLY: signed adverts, plaintext traces, and
# group messages on a PUBLIC channel you declare below. Direct/private messages
# and any channel not listed here are dropped (never retransmitted).
#
# Declare each public channel by its shared key. Only configure channels whose
# key is PUBLISHED publicly - a published key does not obscure meaning, which is
# what makes relaying it legal. Repeatable; base64 or hex (16- or 32-byte key),
# optional "name:" label. With NO entries the repeater relays adverts only.
#
#   public_channel = MyClub:8b3387e9c5cdea6ac9e5edbaa115cd72   # hex, named
#
# The IARU R1 RFC network runs on MeshCore's default "Public" channel (its key
# is published, so relaying it is legal). Enabled by default here:
public_channel   = izOH6cXN6mrJ5e26oRXNcg==

# Answer "ping" on a public channel with "pong" (a presence/liveness check).
# Requires at least one public_channel above (the reply goes out on the same
# channel, encrypted with its published key). Off by default.
ping_pong        = false

# ---- role: full repeater vs personal hotspot ----
# repeater = licensed wide-area repeater (default; uses tx_power above).
# hotspot  = personal bridge for a licensed operator: it relays only YOUR devices
#   UP to the repeater network at full power (to reach it), and the repeaters'
#   traffic back DOWN to your household at the lowest usable power. Same ham band +
#   strict content policy as a repeater, just power-directional and scoped.
#   Check the applicable power limits with your local regulator.
# A repeater IDs with a bare callsign (set 'name' above). A hotspot may append an
# SSID "-NN" (00..99, e.g. name = ON6URE-1) so ONE operator can run several, each
# a distinct on-air ID -- allowed only in hotspot mode.
role             = repeater
# affinity: real repeater callsign(s) this hotspot bridges to (repeatable).
#   affinity = ON0XYZ
# home: your own / friends' device name patterns (wildcards, repeatable) to uplink.
#   home = ON6URE*
#   home = ON4ABC*
# Hotspot TX power = SX126x CHIP dBm (the PA adds gain on top; measure with a meter).
hotspot_power_high = 22        # uplink   (household -> repeater), full power
hotspot_power_low  = -9        # downlink (repeater -> household), lowest usable

# ---- control interface + moderation ----
# Local control port (TCP, bound to 127.0.0.1 only). Drive the headless service
# with the `meshcore-cli` client, e.g. `meshcore-cli status`. 0 = disabled.
control_port     = 4403

# Blacklist: ignore a node by its advertised / public-channel name. Their
# adverts are not relayed or registered, and their public messages are not
# forwarded (nor answered by ping/pong). Repeatable; manage live with
# `meshcore-cli blacklist add|remove|list <name>`.
#   blacklist = ON0XYZ

# Optional location advertised in the self-advert (also used as the APRS iGate
# beacon position below):
# location       = true
# latitude       = 50.8503
# longitude      = 4.3517

# ---- APRS-IS RX iGate (optional) ----
# Gate MeshCore adverts that carry GPS to the APRS-IS network, and beacon this
# repeater's own position (reuses latitude/longitude above). REQUIRES AN AMATEUR
# LICENCE - you inject under your own callsign. Only nodes whose advert name is a
# valid ham callsign are gated (as receive-only 'qAO'); free-text names are skipped.
# aprs_enable          = false
# aprs_call            = ON6URE-6      # callsign-SSID: APRS-IS login + beacon source
# aprs_passcode        = auto          # "auto" computes it from aprs_call, or a number
# aprs_host            = belgium.aprs2.net
# aprs_port            = 14580
# aprs_tocall          = APRFGR        # software id / APRS destination
# aprs_symbol          = R&            # iGate map symbol (Rx-only iGate: diamond+R)
# aprs_node_symbol     = Mn            # gated MeshCore nodes (overlay-M triangle)
# aprs_comment         = meshcore-repeater 1.0 https://rf.guru
# aprs_altitude        = 5             # metres, for the /A= field (0 = omit)
# aprs_beacon_interval = 1800          # seconds between own beacons (0 = off)
# aprs_node_rate       = 900           # min seconds between re-gating the same node
